[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-readme-generator"
version = "1.0.0"
description = "A CLI tool that scans project directories and generates READMEs with Mermaid diagrams using Gemini."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "google-genai",
    "python-dotenv",
    "pathspec",
]

[project.scripts]
gen-readme = "ai_readme.generator:cli"